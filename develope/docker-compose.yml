services:
  # ---- 데이터 저장 계층 (postgres/minio/chromadb) : backend-net에만 존재 ----
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      AIRFLOW_POSTGRES_DB: ${AIRFLOW_POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      # 호스트 5432는 Windows(Hyper-V/WSL) 동적 포트 예약 범위와 겹쳐 바인딩이 실패할 수 있어 15432로 노출.
      # 컨테이너 내부/다른 서비스 간 통신은 그대로 5432(postgres:5432) 사용.
      - "15432:5432"
    networks:
      - backend-net

  chromadb:
    image: chromadb/chroma:latest
    volumes:
      - chromadb-data:/chroma/chroma
    ports:
      - "8200:8000"
    networks:
      - backend-net

  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console UI
    networks:
      backend-net:
        # 고정 IP: k3s 안의 Spark pod는 Docker 내장 DNS(127.0.0.11)를 못 보므로
        # coredns-custom(k3s/coredns-custom.yaml)에서 이 IP를 "minio" 호스트로 등록해준다.
        ipv4_address: 172.28.0.10

  # 버킷을 최초 1회 생성.
  #   datalake     : 수집 원본(raw) + 메달리언 가공 데이터 (raw/bronze/silver/gold 프리픽스)
  #   code         : Git -> (Jenkins CI) -> 업로드되는 Airflow DAG 코드 + Spark 메달리언 스크립트
  #                    code/dags/       : Airflow DAG 정의
  #                    code/spark-jobs/ : ingest.py, bronze.py, silver.py, gold.py (참조용 미러)
  #   reports      : LangGraph가 만든 보고서 파일 (웹에서 조회/다운로드)
  #   spark-events : Spark History Server가 읽는 이벤트 로그 (잡 종료 후 UI 조회용)
  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -e
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do sleep 2; done
        mc mb -p local/datalake
        mc mb -p local/code
        mc mb -p local/reports
        mc mb -p local/spark-events
        # S3에는 실제 디렉터리가 없어서 spark-jobs가 한 번도 안 돈 상태에서는
        # logs/ 프리픽스 자체가 없다. spark-history-server가 시작 시점에 이 경로를
        # stat해서 없으면 FileNotFoundException으로 죽으므로 빈 마커 오브젝트로 미리 만들어둔다.
        echo -n | mc pipe local/spark-events/logs/.keep
        echo 'minio buckets ready'
    networks:
      - backend-net

  # ---- 앱 계층 (fastapi/langgraph/frontend) : app-net + backend-net ----
  fastapi-server:
    build: ./fastapi-server
    environment:
      # psycopg2.connect()에 그대로 넘기는 DSN이라 SQLAlchemy 접두사(+psycopg2) 없이 순수 형태로 둔다.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CHROMADB_HOST: chromadb
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_DATALAKE_BUCKET: datalake
      MINIO_REPORTS_BUCKET: reports
      # /reports/archive-current이 헤드리스 브라우저로 이 주소의 /print/:id를 캡처한다.
      FRONTEND_BASE_URL: http://frontend
    depends_on:
      postgres:
        condition: service_started
      chromadb:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    networks:
      - backend-net
      - app-net

  langgraph-server:
    build: ./langgraph-server
    environment:
      CHROMADB_HOST: chromadb
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_DATALAKE_BUCKET: datalake
      MINIO_REPORTS_BUCKET: reports
      # weekly_reports 저장용. psycopg2로 바로 연결하므로 SQLAlchemy 접두사(+psycopg2) 없이 순수 DSN.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      chromadb:
        condition: service_started
      postgres:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    ports:
      - "8100:8100"
    networks:
      - backend-net
      - app-net

  # 프론트엔드 기술스택 미정 -> 자리만 확보한 placeholder (frontend/Dockerfile 참고).
  # backend-net에는 올리지 않는다: 데이터는 항상 fastapi-server(app-net)를 거쳐서만 접근.
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    networks:
      - app-net

  # spark-jobs는 상시 실행되는 서비스가 아니라 이미지 빌드 용도로만 존재한다.
  # `docker compose build spark-jobs` 후 scripts/load-image-to-k3s.sh 로 k3s에 넣어야
  # KubernetesPodOperator가 이 이미지로 pod를 띄울 수 있다.
  spark-jobs:
    build: ./spark-jobs
    image: gamer_publisher/spark-jobs:latest
    profiles: ["build-only"]

  # 완료된 Spark 잡의 UI(4040)는 드라이버 pod가 사라지면 같이 사라진다.
  # eventLog를 MinIO(spark-events 버킷)에 남기고 History Server가 그걸 읽어 UI를 재구성한다.
  # 실제 DAG의 spark-submit에는 아래 옵션이 필요:
  #   --conf spark.eventLog.enabled=true
  #   --conf spark.eventLog.dir=s3a://spark-events/logs/
  #   --conf spark.hadoop.fs.s3a.endpoint=http://minio:9000
  #   --conf spark.hadoop.fs.s3a.path.style.access=true
  spark-history-server:
    build: ./spark-jobs
    container_name: spark-history-server
    user: root
    entrypoint: /opt/bitnami/spark/bin/spark-class
    command: ["org.apache.spark.deploy.history.HistoryServer"]
    environment:
      SPARK_HISTORY_OPTS: >-
        -Dspark.history.fs.logDirectory=s3a://spark-events/logs/
        -Dspark.hadoop.fs.s3a.endpoint=http://minio:9000
        -Dspark.hadoop.fs.s3a.access.key=${MINIO_ROOT_USER}
        -Dspark.hadoop.fs.s3a.secret.key=${MINIO_ROOT_PASSWORD}
        -Dspark.hadoop.fs.s3a.path.style.access=true
        -Dspark.hadoop.fs.s3a.impl=org.apache.hadoop.fs.s3a.S3AFileSystem
    depends_on:
      minio-init:
        condition: service_completed_successfully
    ports:
      - "18080:18080"   # History Server UI (종료된 Spark 잡)
    networks:
      - backend-net

  # ---- k3s: Spark 작업을 KubernetesPodOperator + dynamicAllocation으로 실행하기 위한
  #      단일 노드 클러스터. Spark 워커(executor pod)는 여기서 작업량에 따라 동적으로 뜨고 사라진다.
  #      backend-net에도 물려있는 이유: pod 안의 Spark 드라이버/executor가 s3a://로 minio에
  #      접근해야 하기 때문 (이 컨테이너의 노드 네트워크를 경유해 나간다). ----
  k3s:
    image: rancher/k3s:v1.29.4-k3s1
    container_name: k8s-master-node
    privileged: true
    command: server --write-kubeconfig-mode=644 --tls-san=k8s-master-node --disable=traefik
    environment:
      K3S_TOKEN: ${K3S_TOKEN:-devtoken}
    volumes:
      - k3s-data:/var/lib/rancher/k3s
      - k3s-kubeconfig:/etc/rancher/k3s
    ports:
      - "6443:6443"
      # Spark Driver UI: k3s/spark-driver-ui-service.yaml의 NodePort(30040)를 호스트 4040에
      # 고정 매핑. 잡이 실행 중일 때만(라벨 매칭되는 pod가 떠 있을 때만) 실제로 응답한다.
      - "4040:30040"
    networks:
      - k8s-net
      - backend-net

  # k3s가 만든 kubeconfig는 server 주소가 "https://127.0.0.1:6443"(k3s 컨테이너 자기 자신 기준)로
  # 박혀 있어서 다른 컨테이너(Airflow)에서는 그대로 못 쓴다. docker 네트워크 안에서는 컨테이너명
  # "k8s-master-node"로 접근 가능하므로 그걸로 치환하고, 그 이름에 대한 SAN이 인증서에 없어서
  # insecure-skip-tls-verify로 검증을 끈 사본을 만들어 공유 볼륨에 저장한다.
  kubeconfig-prep:
    image: alpine:3.20
    container_name: airflow-kubeconfig-prep
    depends_on:
      k3s:
        condition: service_started
    volumes:
      - k3s-kubeconfig:/src:ro
      - kube-config:/dst
    command:
      - sh
      - -c
      - |
        set -e
        until [ -f /src/k3s.yaml ]; do echo 'k3s.yaml 대기 중...'; sleep 2; done
        sed 's#127.0.0.1#k8s-master-node#' /src/k3s.yaml \
          | sed '/certificate-authority-data/d' \
          | sed 's#server: https://k8s-master-node:6443#server: https://k8s-master-node:6443\n    insecure-skip-tls-verify: true#' \
          > /dst/config
        echo 'kubeconfig 준비 완료'
    networks:
      - k8s-net

  # Spark의 네이티브 k8s 스케줄러(--master k8s://...)가 executor pod를 만들 수 있도록
  # ServiceAccount/Role/RoleBinding을 1회 적용한다 (k3s/spark-rbac.yaml).
  k3s-bootstrap:
    image: bitnamilegacy/kubectl:1.29
    container_name: k3s-bootstrap
    depends_on:
      kubeconfig-prep:
        condition: service_completed_successfully
    environment:
      KUBECONFIG: /kube/config
    volumes:
      - kube-config:/kube:ro
      - ./k3s:/manifests:ro
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -e
        until kubectl get nodes >/dev/null 2>&1; do echo 'k3s API 대기 중...'; sleep 2; done
        # 완전히 새로 초기화된 클러스터에서는 API가 응답을 시작한 뒤에도 coredns
        # deployment가 k3s의 내장 addon 컨트롤러에 의해 비동기로 조금 늦게 생성된다.
        # 이 대기 없이 바로 rollout restart를 하면 "deployments.apps coredns not found"로 실패한다.
        until kubectl -n kube-system get deployment/coredns >/dev/null 2>&1; do echo 'coredns deployment 대기 중...'; sleep 2; done
        kubectl apply -f /manifests/spark-rbac.yaml
        kubectl apply -f /manifests/coredns-custom.yaml
        kubectl apply -f /manifests/spark-driver-ui-service.yaml
        kubectl -n kube-system rollout restart deployment/coredns
        kubectl -n kube-system rollout status deployment/coredns --timeout=60s
        echo 'RBAC + coredns-custom + spark-driver-ui Service 적용 완료'
    networks:
      - k8s-net

  # MinIO code 버킷의 dags/ 프리픽스를 Airflow dags 볼륨으로 1회 동기화.
  # 로컬에서 DAG을 고치면 scripts/push_dags_to_minio.sh 로 code 버킷에 올린 뒤
  # `docker compose run --rm dags-sync` 로 다시 반영한다. (Jenkins가 이 두 단계를 대신 수행한다.)
  dags-sync:
    image: minio/mc:latest
    container_name: airflow-dags-sync
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - airflow-dags:/dags
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -e
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do sleep 2; done
        mc mirror --overwrite local/code/dags /dags || echo 'code/dags 비어있음, 건너뜀'
    networks:
      - backend-net

  # 계정을 무작위로 만들게 두지 않고 원하는 아이디/비번으로 고정하기 위한 1회성 초기화.
  airflow-init:
    build: ./airflow
    container_name: airflow-init
    depends_on:
      postgres:
        condition: service_started
    environment:
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${AIRFLOW_POSTGRES_DB}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username "$$_AIRFLOW_WWW_USER_USERNAME" \
          --password "$$_AIRFLOW_WWW_USER_PASSWORD" \
          --firstname Admin --lastname User --role Admin \
          --email "$$_AIRFLOW_WWW_USER_USERNAME@example.com" \
        || true
        airflow users reset-password \
          --username "$$_AIRFLOW_WWW_USER_USERNAME" \
          --password "$$_AIRFLOW_WWW_USER_PASSWORD"
    networks:
      - backend-net

  airflow-webserver:
    build: ./airflow
    container_name: airflow-webserver
    command: webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      kubeconfig-prep:
        condition: service_completed_successfully
      dags-sync:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${AIRFLOW_POSTGRES_DB}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
      KUBECONFIG: /opt/airflow/kube/config
      AIRFLOW_CONN_MINIO_DEFAULT: aws://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@/?endpoint_url=http%3A%2F%2Fminio%3A9000
      # old_games/recent_games 추천 이력 테이블이 있는 app db (airflow 자체 메타 DB와는 다름).
      AIRFLOW_CONN_POSTGRES_APP: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      STEAM_API_KEY: ${STEAM_API_KEY}
    volumes:
      - airflow-dags:/opt/airflow/dags
      - kube-config:/opt/airflow/kube:ro
    ports:
      - "8080:8080"   # Airflow Webserver UI
    networks:
      - backend-net
      - k8s-net

  airflow-scheduler:
    build: ./airflow
    container_name: airflow-scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      kubeconfig-prep:
        condition: service_completed_successfully
      dags-sync:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${AIRFLOW_POSTGRES_DB}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
      KUBECONFIG: /opt/airflow/kube/config
      AIRFLOW_CONN_MINIO_DEFAULT: aws://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@/?endpoint_url=http%3A%2F%2Fminio%3A9000
      # old_games/recent_games 추천 이력 테이블이 있는 app db (airflow 자체 메타 DB와는 다름).
      AIRFLOW_CONN_POSTGRES_APP: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      STEAM_API_KEY: ${STEAM_API_KEY}
    volumes:
      - airflow-dags:/opt/airflow/dags
      - kube-config:/opt/airflow/kube:ro
    networks:
      - backend-net
      - k8s-net

networks:
  # 데이터 저장 계층 전용. frontend/k8s-net 쪽에서는 직접 못 붙고,
  # fastapi-server/langgraph-server/airflow/spark-history-server 처럼 실제로
  # postgres/minio/chromadb가 필요한 서비스만 올라온다.
  # minio에 고정 IP(172.28.0.10)를 줘야 k3s의 coredns-custom hosts 오버라이드로
  # pod 안에서도 "minio" 이름을 해석할 수 있다 (k3s/coredns-custom.yaml 참고).
  backend-net:
    ipam:
      config:
        - subnet: 172.28.0.0/24
  # 사용자 대면 앱 계층. frontend는 fastapi-server를 통해서만 데이터에 접근한다.
  app-net:
  # k3s 컨트롤플레인 + Airflow의 KubernetesPodOperator 연동 전용.
  k8s-net:

volumes:
  postgres-data:
  chromadb-data:
  minio-data:
  k3s-data:
  k3s-kubeconfig:
  kube-config:
  airflow-dags:
