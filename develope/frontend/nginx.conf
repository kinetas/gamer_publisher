server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # 프론트 JS는 항상 상대경로 /api/...로만 호출한다. 실제 사용자가 브라우저로
    # localhost:3000에 접속하든, fastapi-server의 Playwright가 컨테이너 내부에서
    # http://frontend/print/:id 를 열든 "현재 origin + /api"는 항상 유효하고,
    # 여기서 진짜 백엔드 주소(fastapi-server:8000)로 프록시해준다.
    location /api/ {
        proxy_pass http://fastapi-server:8000/;
    }

    # react-router가 클라이언트 사이드에서 처리하는 경로(/print/:id 등)를
    # 직접 열거나 헤드리스 브라우저가 goto할 때도 항상 index.html을 내려준다.
    location / {
        try_files $uri /index.html;
    }
}
